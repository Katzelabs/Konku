# Dependency updates.
#
# CI is already a real merge gate — govulncheck, `npm audit --audit-level=high`,
# vet, the purity rule, sqlc drift — but every one of those is *reactive*. They
# tell you a vulnerability is already in the tree. Nothing told you a dependency
# had moved, and the govulncheck pin (`@v1.6.0` in ci.yml) meant the scanner
# itself aged silently: a tool that is a year behind reports a year-old view of
# the world and looks exactly as green as a current one.
#
# The dependency budget (D-065) is not in tension with this. That rule governs
# *adding* a dependency — each one names the production obligation it discharges
# — and says nothing about keeping the ones already justified up to date. A
# short dependency list is easier to keep current, not an excuse not to.
version: 2

updates:
  # Grouped, and this is the setting that decides whether any of this is used.
  #
  # Four ecosystems ungrouped is up to nine PRs a week against a project with
  # one maintainer, which is not review — it is a queue that gets closed in bulk
  # or ignored, and either way the update does not happen. One PR per ecosystem
  # per week is a thing a person actually reads.
  #
  # Majors stay separate on purpose: a major is a change with a migration note
  # to read, and burying one in a batch of patch bumps is how a breaking change
  # gets merged unread.
  #
  # The exception is a set of packages that peer-depend on each other, where
  # "one major per PR" produces PRs that are individually impossible rather
  # than merely separate. See vite-toolchain below.

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(go)"

  # web/, not the root — package.json lives there (D-032).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # The build toolchain, majors included — and the inclusion is the point.
      #
      # These packages pin each other, so a major in one is half a change
      # rather than a whole one. Raised separately, each half is a PR that can
      # never go green — not a migration note to read at leisure, but two PRs
      # that are impossible on their own. It happened: #4 (vite 8) and #5
      # (plugin-react 6) were both closed unmerged and combined by hand in #10.
      #
      # Two kinds of coupling, both real:
      #
      #   peer ranges on vite — @vitejs/plugin-react, vitest and
      #   @tailwindcss/vite each declare one, so a vite major outside the range
      #   fails `npm ci` with ERESOLVE until its partner moves too;
      #
      #   exact pins — @tailwindcss/vite depends on `tailwindcss` at the
      #   identical version (4.3.3 today), and @vitest/coverage-v8 on vitest.
      #   Bumping one alone installs a second nested copy of the other and the
      #   build breaks on a version skew npm was happy to resolve.
      #
      # `tailwindcss` is therefore here despite a Tailwind major being a
      # genuine migration (the design tokens live in CSS — see docs/DESIGN.md).
      # Splitting it would not buy the careful read the majors rule is after;
      # it would buy two red PRs instead of one readable one.
      #
      # Listed before the catch-all: a dependency joins the first group whose
      # rules it matches, so these leave via this group for every update type
      # while everything else keeps the majors-stay-separate policy above.
      build-toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
          - "tailwindcss"
          - "@tailwindcss/*"
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(web)"

  # The Dockerfile's three base images: node, golang and alpine. The last is
  # what actually ships, so its CVEs are the ones that reach production.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: "deps(docker)"

  # The workflows themselves. This is also what keeps the govulncheck pin
  # moving — the pin is deliberate, because a new govulncheck release should not
  # fail an unrelated PR the day it lands, but a pin nobody advances is just a
  # stale scanner with extra steps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"
