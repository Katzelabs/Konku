# Production: app only. Postgres and the edge live in `Katzelabs/platform` on
# the VPS and are reached over the external `platform` network (D-024, D-088).
#
# The network was called `shared` until 2026-08-17 and never actually existed
# on the box under that name — the platform stack creates `platform`. This file
# is the app half of the contract in platform/PLATFORM.md:
#
#   - no `ports:` — the edge is the only thing on the box that publishes any
#   - `caddy.*` labels are the routing config; caddy-docker-proxy reads them off
#     the running container and reconfigures the edge live, without a restart
#   - a memory limit, a healthcheck and `restart: unless-stopped`, so one app
#     cannot take the box down for every other app on it
#
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
#
# `platform` is created by the platform stack (`make net` there), not here.

# Pin the project name. Compose otherwise derives it from the directory, and
# the directory on the box is what somebody happened to clone into.
name: konku

services:
  app:
    # The image to run, and it must be a **digest** ref (D-061):
    #
    #   KONKU_IMAGE=ghcr.io/katzelabs/konku@sha256:<digest>
    #
    # This was `konku:latest` until 2026-08-14, which could not work on the
    # box: CI publishes to ghcr.io, so a bare local tag names an image that was
    # never pulled and cannot be. `docker compose pull` would have gone looking
    # for it on Docker Hub.
    #
    # `:?` rather than a default, deliberately. A default here is the failure
    # D-061 is about — deploying something other than the artifact that was
    # verified — and it would be silent. Unset, this refuses to start and says
    # what to set.
    #
    # A tag would also "work" and is the thing not to do: a tag can be moved
    # after it was tested, and then what is running in production is a question
    # nobody can answer. `make release-verify REF=...@sha256:...` verifies the
    # exact digest before it reaches the box.
    image: ${KONKU_IMAGE:?set KONKU_IMAGE to a ghcr.io digest ref, e.g. ghcr.io/katzelabs/konku@sha256:...}
    restart: unless-stopped
    environment:
      # Two principals, and the difference matters (D-059).
      #
      # DATABASE_URL is konku_app: the non-owner role FORCE ROW LEVEL SECURITY
      # actually applies to, with no DDL rights at all.
      #
      # **konku_app must already be able to log in before this container is
      # ever started.** cmd/konku opens the pool and pings it *before* it runs
      # migrations, and migration 00006 is what creates konku_app — as NOLOGIN,
      # with no password, because a password in a migration is a secret in git.
      # So on a fresh database the first boot connects as a role that does not
      # exist yet and the container dies. `make provision` on the platform side
      # creates the owner only; the app role is a separate, explicit step. See
      # docs/runbooks/deploy.md.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the konku_app role, e.g. postgres://konku_app:...@postgres:5432/konku}
      # MIGRATION_DATABASE_URL is the owner, used once at startup and then
      # closed. **Required here**: leaving it unset falls back to DATABASE_URL,
      # which cannot run DDL — and migrations run at startup with a failure
      # that is fatal by design, so the container would not survive its first
      # boot on a fresh database.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL to the owner role, e.g. postgres://konku:...@postgres:5432/konku}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET, openssl rand -base64 32}
      ALLOW_SIGNUP: "false"
      DEV: "false"

      # Error tracking (06 P3).
      #
      # SENTRY_RELEASE is deliberately absent: the binary carries the version
      # stamped at build time, and setting this would override it with
      # something that has to be kept in sync by hand. An event should point at
      # the release that produced it (D-062).
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: production

      # /metrics on its own listener (D-062, amended by D-081).
      #
      # 0.0.0.0 here, and that is not the mistake it looks like. A container
      # has its own network namespace, so 127.0.0.1 inside it is the
      # *container's* loopback: nothing on the host and nothing on the
      # `platform` network could reach it, and the metric this app is most
      # likely to fall over on — pool saturation — was observable only through
      # `docker exec`.
      #
      # The property the old value was reaching for is delivered by the absence
      # of a `ports:` entry, not by the bind address. Unpublished means
      # unroutable from the internet no matter what it binds, while a sibling
      # Prometheus on `platform` can still scrape it. A separate socket still
      # cannot be exposed by a Caddy misconfiguration the way a route on the
      # main mux can, which was always the real argument.
      #
      # Do NOT add 9090 to `ports:`. That is the line that would make this
      # public, and it is the only one.
      #
      # 9090 is also Cockpit's port on this box, and Cockpit's exposure was a
      # live finding (VPS Infra P1.1). They are unrelated: this one is inside a
      # container namespace and publishes nothing. Do not confuse them when
      # auditing `ss -ltnp` on the host.
      METRICS_ADDR: 0.0.0.0:9090

      # Mail (07 L2, D-068). Resend over SMTP on 465 — smtps, not smtp:
      # net/smtp refuses to send the API key over an unencrypted connection.
      #
      # These are required before ALLOW_SIGNUP can become "true" (07 L10):
      # config refuses to start without them, because an account that cannot
      # be verified can never be recovered either.
      #
      # No `:?` on these two: ALLOW_SIGNUP is "false", and config only demands
      # a transport when signup is open. They become required at 07 L10.
      SMTP_URL: ${SMTP_URL}              # smtps://resend:re_...@smtp.resend.com:465
      MAIL_FROM: ${MAIL_FROM}            # Konku <konku@katzeapps.com>
      # Must match KONKU_HOST. Every verification and reset link is built
      # against it, and a wrong value is only discovered after the mail has
      # already been delivered — so this one *is* guarded.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to https://$KONKU_HOST}
    # A wedged process counts as up forever under `restart: unless-stopped`,
    # and /healthz exists precisely so it does not have to.
    #
    # /healthz and NOT /readyz. They are split because the correct response to
    # each is the opposite of the other (D-062): readiness goes red on a
    # database blip, and restarting the container is exactly the wrong answer
    # to that — it throws away the warm pool and every in-flight request to fix
    # something that was never the container's fault. Liveness is the one that
    # means "restart me".
    #
    # busybox wget, because the image is alpine and has it. No curl, and no
    # need for one.
    #
    # `-q -T 3 --spider` and not `--quiet --tries=1`: busybox tolerates the GNU
    # long forms today but documents neither, and the failure mode of a flag
    # that stops being tolerated is a healthcheck that fails forever — which
    # under a restart policy is an outage caused entirely by its own monitoring.
    # -T bounds the read at 3s, inside Docker's own 5s timeout.
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      # Generous, because migrations run at startup and a cold start on a new
      # migration is legitimately slow. A start_period that is too short turns
      # a normal deploy into a restart loop.
      start_period: 30s
      retries: 3

    # The pgx pool is capped at 10 connections so one project cannot exhaust
    # every slot on a shared Postgres (D-028). This is the same argument for
    # the same box's memory: an OOM here is an OOM for every co-tenant project,
    # and unbounded is not a bound.
    #
    # 512m against a hashing ceiling of 4 x 64 MiB (internal/auth/password.go),
    # so the argon2 bound is stated twice and neither statement is the only one
    # (hard rule 9).
    mem_limit: 512m

    # The binary is CGO_ENABLED=0 static, runs as uid 10001, and writes nothing
    # to disk — the export is built in memory and streamed to the response, and
    # slog goes to stdout. So none of this costs anything, which is the reason
    # to do it rather than to argue about it.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Insurance for anything in the standard library that reaches for a temp
    # file. Small, and in memory, so read_only stays true where it matters.
    tmpfs:
      - /tmp:size=64m

    networks:
      - platform

    # This label set IS the production routing config. caddy-docker-proxy reads
    # it off the running container and rewrites the edge's Caddyfile live.
    labels:
      caddy: ${KONKU_HOST:?set KONKU_HOST, e.g. konkuapp.katzeapps.com}
      # 8080 must be the port the binary actually listens on (PORT's default).
      # Nothing checks that these agree; if they drift the edge generates a
      # proxy to a dead port and every request is a 502.
      caddy.reverse_proxy: "{{upstreams 8080}}"

      # Deliberately NOT `caddy.import: security_headers`, and this is a
      # considered deviation from PLATFORM.md's template rather than an
      # omission (D-088).
      #
      # internal/api/security.go already sets X-Content-Type-Options,
      # Referrer-Policy, X-Frame-Options, Permissions-Policy, COOP and CORP,
      # with a *stricter* Permissions-Policy than the shared snippet and two
      # headers the snippet does not have. Caddy's `header` directive sets
      # rather than appends, so importing the snippet would quietly replace
      # this app's values with weaker ones.
      #
      # It would also break the HSTS below. The platform Caddyfile documents
      # that two `header` directives in one site block do not merge — Caddy
      # keeps the first and silently drops the second — so an import plus this
      # label yields one of them and no error.
      #
      # For the same reason, do not import `csp_spa`: it allows
      # style-src 'unsafe-inline' and connect-src wss:, and this app's own CSP
      # allows neither. Do not import `no_uploads` either — it caps bodies at
      # 64 KB and a note is allowed 256 KiB of markdown.
      #
      # HSTS is the one header the edge must add, because only the component
      # that terminates TLS knows the connection was really secure.
      #
      # Short max-age deliberately — HSTS cannot be withdrawn inside its own
      # window, so a year-long policy over broken renewal makes the site
      # unreachable for a year. Raise to 31536000 once renewal is observed
      # working on the box (04-ship S1). Note that a longer value with
      # `includeSubDomains` contains a space and will need inner quoting here.
      caddy.header.Strict-Transport-Security: "max-age=300"

networks:
  # Created by the platform stack (`make net` in Katzelabs/platform), not here.
  # `name:` is redundant for an external network — Compose does not prefix
  # those — and is written out anyway to match PLATFORM.md's template, so the
  # network this joins is stated rather than inferred from a YAML key.
  platform:
    external: true
    name: platform
